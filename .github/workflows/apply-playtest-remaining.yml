name: apply-playtest-remaining
on:
  push:
    branches: [playtest-notes-progression]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playtest-notes-progression
      - name: Apply remaining hunks and drop this scaffolding
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          render = Path('src/game/render.ts')
          r = render.read_text()
          old1 = """      if (tile === Tile.HeartContainer || tile === Tile.Pedestal) {
        blitTile(ctx, sheet, carveTo(map.biome[i] as Biome), sx, sy);
      }
      // A gorge with water in it is a river, and should look like one. Dry,
"""
          new1 = """      if (tile === Tile.HeartContainer || tile === Tile.Pedestal) {
        blitTile(ctx, sheet, carveTo(map.biome[i] as Biome), sx, sy);
      }
      if (tile === Tile.Skiff) {
        const tracked = state.boatX === tx && state.boatY === ty;
        const under = tracked ? state.boatUnderTile : carveTo(map.biome[i] as Biome);
        blitTile(ctx, sheet, under === Tile.Skiff ? carveTo(map.biome[i] as Biome) : under, sx, sy);
      }
      // A gorge with water in it is a river, and should look like one. Dry,
"""
          if old1 not in r:
              raise SystemExit('render skiff site missing')
          r = r.replace(old1, new1, 1)
          r = r.replace("const FACE_LIP = '#9a917f';\nconst FACE_ROCK = '#4a443b';\nconst FACE_FOOT = '#26221c';\n",
                        "const FACE_LIP = '#2a2620';\nconst FACE_ROCK = '#141210';\nconst FACE_FOOT = '#0a0908';\n", 1)
          render.write_text(r)

          state = Path('src/game/state.ts')
          s = state.read_text()
          old_seal = """/** Rod tier that parts a seal of pitch. */
const SEAL_TIER = Resource.Pitch;
"""
          new_seal = """function sealResourceOf(tile: number): Resource | null {
  switch (tile) {
    case Tile.ReedSeal:
      return Resource.Fiber;
    case Tile.WoodSeal:
      return Resource.Wood;
    case Tile.StoneSeal:
      return Resource.Stone;
    case Tile.PitchSeal:
      return Resource.Pitch;
    default:
      return null;
  }
}
"""
          if old_seal not in s:
              raise SystemExit('state SEAL_TIER site missing')
          s = s.replace(old_seal, new_seal, 1)
          old_chest = """    case RewardKind.SerpentRod:
      state.rodReach = 2;
      break;
  }
"""
          new_chest = """    case RewardKind.SerpentRod:
      state.rodReach = 2;
      break;
    case RewardKind.Chart:
      state.hasChart = true;
      break;
    case RewardKind.Galoshes:
      state.hasGaloshes = true;
      break;
  }
"""
          if old_chest not in s:
              raise SystemExit('state chest site missing')
          s = s.replace(old_chest, new_chest, 1)
          old_obs = """  if (tile === Tile.PitchSeal) {
    const ready = state.rodTier >= SEAL_TIER;
    return {
      tile,
      label: ready
        ? 'Part the seal \u2014 the Rod knows pitch'
        : 'A seal of pitch. The Rod is not ready for this.',
      affordable: ready,
    };
  }
"""
          new_obs = """  const needed = sealResourceOf(tile);
  if (needed !== null) {
    const ready = state.rodTier >= needed;
    const name = RESOURCE_LABEL[needed];
    return {
      tile,
      label: ready
        ? `Part the seal \u2014 the Rod knows ${name}`
        : `A seal of ${name}. The Rod is not ready for this.`,
      affordable: ready,
    };
  }
"""
          if old_obs not in s:
              # try ascii dash variant
              old_obs2 = old_obs.replace('\u2014', '\u2014')
              print('obs match', old_obs in s)
              idx = s.find('if (tile === Tile.PitchSeal)')
              print(repr(s[idx:idx+280]) if idx>=0 else 'no pitchseal')
              raise SystemExit('state obstacle site missing')
          s = s.replace(old_obs, new_obs, 1)
          old_clear = """  if (tile === Tile.PitchSeal) {
    if (state.rodTier < SEAL_TIER) {
      say(state, 'The seal holds. Imbue the Rod with pitch and return.');
      return;
    }
    convertConnected(map, tx, ty, tile, Tile.DungeonFloor);
    state.mapRevision++;
    say(state, 'The Rod drinks the pitch. The seal parts.');
    return;
  }
"""
          new_clear = """  const needed = sealResourceOf(tile);
  if (needed !== null) {
    const name = RESOURCE_LABEL[needed];
    if (state.rodTier < needed) {
      say(state, `The seal holds. Imbue the Rod with ${name} and return.`);
      return;
    }
    convertConnected(map, tx, ty, tile, Tile.DungeonFloor);
    state.mapRevision++;
    say(state, `The Rod drinks the ${name}. The seal parts.`);
    return;
  }
"""
          if old_clear not in s:
              raise SystemExit('state tryClear site missing')
          s = s.replace(old_clear, new_clear, 1)
          if 'SEAL_TIER' in s:
              raise SystemExit('SEAL_TIER still present')
          state.write_text(s)
          print('patched render and state')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/state.ts src/game/render.ts
          git rm -f playtest-remaining.patch .github/workflows/apply-playtest-remaining.yml
          git commit -m 'Part biome seals; blit skiff ground; darken seam faces.'
          git push
