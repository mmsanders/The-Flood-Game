name: apply-playtest-remaining
on:
  push:
    branches: [playtest-notes-progression]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playtest-notes-progression
      - name: Patch state and render
        run: python3 scripts/apply-playtest-remaining.py
      - name: Commit and drop scaffolding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/state.ts src/game/render.ts
          git rm -f playtest-remaining.patch scripts/apply-playtest-remaining.py .github/workflows/apply-playtest-remaining.yml
          if git diff --cached --quiet; then
            echo nothing to commit
            exit 0
          fi
          git commit -m 'Part biome seals; blit skiff ground; darken seam faces.'
          git push
