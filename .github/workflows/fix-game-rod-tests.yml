name: fix-game-rod-tests
on:
  push:
    branches: [playtest-notes-progression]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: playtest-notes-progression
      - run: python3 scripts/fix-game-rod-tests.py
      - run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/game.test.ts
          git rm -f scripts/fix-game-rod-tests.py .github/workflows/fix-game-rod-tests.yml
          if git diff --cached --quiet; then echo nothing; exit 0; fi
          git commit -m 'Point rod reward tests at mountain and scrub dungeons.'
          git push
